<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Init social card — postmark / "mailing paper" look (matches the site
       revamp: CREAM palette, Oswald caps, Space Mono labels, hard offset
       shadow, dashed franking border, rubber stamp + postmark ring).
       Rasterised with @resvg/resvg-js against bundled Oswald + Space Mono. -->

  <rect width="1200" height="630" fill="#F2E6CD"/>

  <!-- hard offset shadow block -->
  <rect x="76" y="66" width="1064" height="512" rx="6" fill="#0C2B4F"/>
  <!-- card -->
  <rect x="60" y="50" width="1064" height="512" rx="6" fill="#FFF8EA" stroke="#0C2B4F" stroke-width="3"/>
  <!-- dashed franking frame -->
  <rect x="90" y="80" width="1004" height="452" fill="none" stroke="#0C2B4F" stroke-width="2.5" stroke-dasharray="11 8"/>

  <!-- Init postmark glyph -->
  <g transform="translate(132,130) scale(0.36)">
    <rect x="24" y="24" width="464" height="464" rx="108" fill="#0B1E33"/>
    <g transform="translate(256,258) scale(1.42) translate(-210,-206)">
      <path d="M163,142 L290,142 L290,232 L163,232 Z" fill="#FFF8EA" fill-opacity="0.08"/>
      <path d="M185,142 L322,142 Q344,142 344,164 L344,269 Q344,291 322,291 L300,291 L330,329 L270,291 L185,291 Q163,291 163,269 L163,164 Q163,142 185,142 Z"
            fill="none" stroke="#E56A4B" stroke-width="15"/>
      <path d="M98,83 L268,83 Q290,83 290,105 L290,210 Q290,232 268,232 L160,232 L118,270 L140,232 L98,232 Q76,232 76,210 L76,105 Q76,83 98,83 Z"
            fill="none" stroke="#FFF8EA" stroke-width="15"/>
      <path d="M207.25,195 L226.75,214.5 L256,175.5"
            fill="none" stroke="#FFF8EA" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="348" y="266" font-family="Oswald" font-weight="700" font-size="150"
        letter-spacing="-3" fill="#0C2B4F">IN<tspan fill="#C83C2D">IT</tspan></text>

  <!-- rubber stamp -->
  <g transform="rotate(-3.5 968 132)">
    <rect x="846" y="102" width="244" height="60" fill="none" stroke="#C83C2D" stroke-width="3"/>
    <text x="968" y="141" text-anchor="middle" font-family="Space Mono" font-weight="700"
          font-size="24" letter-spacing="5" fill="#C83C2D">INIT LOUNGE</text>
  </g>

  <!-- tagline -->
  <text x="136" y="406" font-family="Oswald" font-weight="600" font-size="58"
        letter-spacing="0.5" fill="#0C2B4F">SAME PLACE. SAME VIBE.</text>
  <text x="136" y="474" font-family="Oswald" font-weight="700" font-size="58"
        letter-spacing="0.5" fill="#C83C2D">NOW WHAT?</text>

  <!-- url -->
  <text x="138" y="518" font-family="Space Mono" font-weight="700" font-size="21"
        letter-spacing="3" fill="#5A6B80">INITMATCH.COM</text>

  <!-- postmark cancellation ring -->
  <g transform="rotate(-4 992 452)">
    <circle cx="992" cy="452" r="70" fill="none" stroke="#0B497F" stroke-width="3"/>
    <text x="992" y="440" text-anchor="middle" font-family="Space Mono" font-weight="700"
          font-size="20" letter-spacing="1" fill="#0B497F">INIT</text>
    <line x1="954" y1="452" x2="1030" y2="452" stroke="#0B497F" stroke-width="2"/>
    <text x="992" y="476" text-anchor="middle" font-family="Space Mono" font-weight="700"
          font-size="15" letter-spacing="1" fill="#0B497F">LOUNGE</text>
  </g>
</svg>
