  <!-- Init social card - gold interlocked chat bubbles + checkmark on matte black,
       mirroring the app icon (init repo: assets-logo/init-gold-icon.svg).
       The "Init" wordmark below is Plus Jakarta Sans ExtraBold (the site font)
       converted to outline paths, so the card rasterises identically in every
       renderer with zero font dependency. To re-cut it if the mark ever changes,
       outline "Init" at 88px from PlusJakartaSans-ExtraBold (Google Fonts /
       github.com/tokotype/PlusJakartaSans), centred on x=600, baseline y=482. -->
