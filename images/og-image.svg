<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050510;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12122a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f72585;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4cc9f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="60" y="60" width="1080" height="510" rx="60" fill="#0d0d24"/>

  <!-- Logo + Init centered, scaled for 1200×630 -->
  <g transform="translate(600,270) scale(2.2) translate(-180,-158.5)">
    <!-- Pink bubble -->
    <rect x="60" y="65" width="170" height="105" rx="22" fill="none" stroke="#f72585" stroke-width="8" opacity="0.85"/>
    <polyline points="75,170 60,198 100,170" fill="none" stroke="#f72585" stroke-width="8" opacity="0.85"/>

    <!-- Cyan bubble -->
    <rect x="130" y="80" width="170" height="105" rx="22" fill="none" stroke="#4cc9f0" stroke-width="8" opacity="0.85"/>
    <polyline points="287,185 300,213 262,185" fill="none" stroke="#4cc9f0" stroke-width="8" opacity="0.85"/>

    <!-- Overlap tint -->
    <rect x="130" y="80" width="100" height="90" rx="0" fill="#7209b7" opacity="0.15"/>

    <!-- Checkmark -->
    <polyline points="155,130 175,146 205,104" stroke="url(#check)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Text -->
    <text x="195" y="252" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-size="68" font-weight="800" fill="#e8e8ff" text-anchor="middle" letter-spacing="6">Init</text>
  </g>

</svg>
